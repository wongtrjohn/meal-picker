<style>
/* Layout: one soft card floating in a buttery sky. Mascot on top, choices stacked under it, action bar at the card's foot. One question per screen. */
:root{
  --butter:#FFE4A3;
  --butter-deep:#F5BE3F;
  --cream:#FFFAEF;
  --peach:#FFC9AE;
  --mint:#9FDCC2;
  --cocoa:#4B3621;
  --cocoa-soft:#9A8167;
  --sky:#FFF2CE;
  --shadow:rgba(120,85,40,.16);
  --font-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme: light;
}
html{
  /* keep content clear of the phone's system bars when served standalone;
     inside a Claude artifact the wrapper sets the same thing */
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
html,body{min-height:100%}
body{
  margin:0;
  font-family:var(--font-body);
  color:var(--cocoa);
  background:
    radial-gradient(900px 520px at 12% -8%, var(--butter) 0%, transparent 62%),
    radial-gradient(760px 500px at 92% 108%, var(--peach) 0%, transparent 58%),
    var(--sky);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:22px 34px;
}

/* ---------- shell ---------- */
.shell{width:100%;max-width:470px;display:flex;flex-direction:column;gap:14px}
.progress-wrap{display:flex;align-items:center;gap:10px;padding:0 4px;min-height:22px}
.progress-track{flex:1;min-width:0;height:9px;border-radius:99px;background:rgba(255,255,255,.72);box-shadow:inset 0 1px 3px var(--shadow);overflow:hidden}
.progress-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--butter-deep),var(--peach));transition:width .45s cubic-bezier(.4,1.5,.5,1)}
.progress-label{font-size:.74rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--cocoa-soft);white-space:nowrap}

.card{
  background:var(--cream);
  border:2.5px solid #fff;
  border-radius:30px;
  box-shadow:0 18px 44px -14px var(--shadow), 0 2px 0 rgba(255,255,255,.9) inset;
  padding:22px 20px 20px;
  display:flex;flex-direction:column;gap:16px;
}

/* ---------- mascot ---------- */
.mascot-stage{display:flex;justify-content:center;position:relative;margin-top:-4px}
.mascot{width:118px;height:118px;overflow:visible}
.mascot-img{width:132px;height:132px;object-fit:contain;animation:bob 2.6s ease-in-out infinite}
.bob{animation:bob 2.6s ease-in-out infinite;transform-origin:60px 104px}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-7px) scale(.985,1.02)}}
.twinkle{animation:twinkle 1.9s ease-in-out infinite}
.twinkle:nth-of-type(2){animation-delay:.5s}
.twinkle:nth-of-type(3){animation-delay:1s}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.75)}50%{opacity:1;transform:scale(1.15)}}
.prop{position:absolute;right:6px;top:4px;font-size:1.9rem;filter:drop-shadow(0 3px 5px var(--shadow));animation:bob 2.6s ease-in-out infinite}
.prop:empty{display:none}

/* ---------- type ---------- */
.eyebrow{font-family:var(--font-body);font-size:.72rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--butter-deep);text-align:center}
h1{font-family:var(--font-display);font-size:clamp(1.65rem,7.2vw,2.15rem);line-height:1.1;font-weight:800;margin:0;text-align:center;text-wrap:balance}
h2{font-family:var(--font-display);font-size:clamp(1.3rem,5.6vw,1.6rem);line-height:1.15;font-weight:800;margin:0;text-align:center;text-wrap:balance}
.sub{font-size:.95rem;line-height:1.45;color:var(--cocoa-soft);text-align:center;margin:0;font-weight:600;text-wrap:balance}
.sub:empty{display:none}
.leg-label{font-family:var(--font-display);font-size:1rem;font-weight:700;display:flex;align-items:center;gap:7px;margin:2px 0 -4px 2px}
.leg-label span{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--cocoa-soft);font-family:var(--font-body)}

/* ---------- options ---------- */
.options{display:flex;flex-direction:column;gap:10px}
.opt{
  -webkit-appearance:none;appearance:none;
  font-family:var(--font-body);font-size:.97rem;font-weight:700;line-height:1.35;color:var(--cocoa);
  text-align:left;background:#fff;border:2.5px solid #F3E6CC;border-radius:20px;
  padding:14px 15px;cursor:pointer;display:flex;align-items:center;gap:12px;
  transition:transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
  width:100%;
}
.opt .ico{font-size:1.45rem;line-height:1;flex:0 0 auto}
.opt .ico:empty{display:none}
.opt .txt{min-width:0}
.opt .txt small{display:block;font-weight:600;font-size:.82rem;color:var(--cocoa-soft);margin-top:3px}
.opt:hover{border-color:var(--butter);transform:translateY(-2px)}
.opt:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.opt[aria-pressed="true"]{background:var(--butter);border-color:var(--butter-deep);box-shadow:0 8px 18px -8px var(--shadow)}
.opt[aria-pressed="true"]::after{content:"\2713";margin-left:auto;font-weight:800;color:var(--cocoa);font-size:1.05rem}

.opt-row{display:flex;gap:10px}
.opt-row .opt{flex:1 1 0;min-width:0;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:13px}
.opt-row .opt::after{margin-left:0}
.opt-row .opt .ico{font-size:1.35rem}

.shortcuts{display:flex;gap:9px;flex-wrap:wrap}
.chip{
  -webkit-appearance:none;appearance:none;font-family:var(--font-body);font-size:.82rem;font-weight:800;
  color:var(--cocoa);background:rgba(255,255,255,.85);border:2px dashed #E8D4AE;border-radius:99px;
  padding:9px 13px;cursor:pointer;flex:1 1 auto;transition:all .15s ease;
}
.chip:hover{border-color:var(--butter-deep);background:#fff}
.chip[aria-pressed="true"]{background:var(--mint);border-style:solid;border-color:#6FC3A2}
.chip:focus-visible{outline:3px solid var(--mint);outline-offset:2px}

.blank{margin-top:-2px;display:none}
.blank.show{display:block}
.blank input{
  width:100%;box-sizing:border-box;font-family:var(--font-body);font-size:1rem;font-weight:700;color:var(--cocoa);
  background:#fff;border:2.5px solid var(--butter-deep);border-radius:16px;padding:12px 14px;
}
.blank input::placeholder{color:#CDBCA2;font-weight:600}
.blank input:focus-visible{outline:3px solid var(--mint);outline-offset:1px}

/* ---------- actions ---------- */
.actions{display:flex;gap:10px;align-items:center;margin-top:2px}
.btn{
  -webkit-appearance:none;appearance:none;font-family:var(--font-display);font-weight:800;font-size:1.08rem;
  border-radius:99px;padding:14px 22px;cursor:pointer;border:none;transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
}
.btn-primary{flex:1;background:linear-gradient(170deg,var(--butter-deep),#E8A51F);color:#4B3621;box-shadow:0 8px 0 -2px #CE8E12, 0 14px 22px -10px var(--shadow)}
.btn-primary:hover:not(:disabled){transform:translateY(-2px)}
.btn-primary:active:not(:disabled){transform:translateY(2px);box-shadow:0 4px 0 -2px #CE8E12}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-ghost{background:transparent;color:var(--cocoa-soft);border:2.5px solid #EFE0C4;font-size:.95rem;padding:13px 16px}
.btn-ghost:hover{color:var(--cocoa);border-color:var(--butter)}
.btn:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.hint{font-size:.78rem;font-weight:700;color:var(--cocoa-soft);text-align:center;min-height:1em}

/* ---------- screens ---------- */
.screen[hidden]{display:none!important}
.screen{animation:enter .4s cubic-bezier(.2,.9,.3,1) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- loading ---------- */
.loader{display:flex;flex-direction:column;align-items:center;gap:16px;padding:26px 0 18px}
.loader .mascot{width:132px;height:132px}
.hop{animation:hop 1s cubic-bezier(.3,.9,.4,1) infinite;transform-origin:60px 104px}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}25%{transform:translateY(-18px) scale(.95,1.07)}55%{transform:translateY(0) scale(1.07,.93)}75%{transform:translateY(-4px)}}
.load-msg{font-family:var(--font-display);font-weight:700;font-size:1.12rem;text-align:center;min-height:2.6em;text-wrap:balance}
.dots{display:flex;gap:7px}
.dots i{width:10px;height:10px;border-radius:99px;background:var(--butter-deep);animation:pulse 1.1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.18s}
.dots i:nth-child(3){animation-delay:.36s}
@keyframes pulse{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-6px)}}

/* ---------- summary ---------- */
.receipt{background:#fff;border:2.5px solid var(--butter);border-radius:24px;padding:18px 17px;display:flex;flex-direction:column;gap:13px}
.thanks{font-family:var(--font-display);font-weight:700;font-size:1.04rem;line-height:1.35;text-wrap:balance}
.lines{display:flex;flex-direction:column;gap:11px;margin:0;padding:0;list-style:none}
.lines li{display:flex;flex-direction:column;gap:3px;padding-left:12px;border-left:3.5px solid var(--butter);line-height:1.4}
.lines b{font-family:var(--font-display);font-size:.95rem;font-weight:700;color:var(--cocoa-soft)}
.lines span{font-size:1.02rem;font-weight:800}
.grand{background:linear-gradient(165deg,var(--butter),var(--peach));border-radius:22px;padding:17px 16px;font-family:var(--font-display);font-size:1.1rem;font-weight:700;line-height:1.4;text-wrap:balance;box-shadow:0 10px 22px -12px var(--shadow)}
.sendoff{font-family:var(--font-display);font-size:1.18rem;font-weight:800;text-align:center;line-height:1.3;text-wrap:balance}
.ok{font-size:.8rem;font-weight:800;color:#2F8F67;text-align:center;min-height:1em}

/* keep the whole plan inside one phone screenshot */
#s-done .mascot{width:74px;height:74px}
#s-done .prop{font-size:1.45rem;top:0}
#s-done .receipt{padding:13px 14px;gap:9px;border-radius:20px}
#s-done .thanks{font-size:.95rem;line-height:1.3}
#s-done .lines{gap:8px}
#s-done .lines b{font-size:.84rem}
#s-done .lines span{font-size:.95rem}
#s-done .grand{padding:13px 14px;font-size:1rem;line-height:1.35;border-radius:18px}
#s-done .sendoff{font-size:1.04rem}
#s-done .eyebrow{font-size:.68rem}

@media (prefers-reduced-motion: reduce){
  .bob,.twinkle,.hop,.prop,.dots i,.screen{animation:none!important}
  .progress-fill{transition:none}
}
</style>
</head>
<body>

<div class="shell">

  <div class="progress-wrap">
    <div class="progress-label" id="plabel"></div>
    <div class="progress-track"><div class="progress-fill" id="pfill"></div></div>
  </div>

  <div class="card">

    <!-- 0. TITLE -->
    <section class="screen" id="s-title">
      <div class="mascot-stage" data-mascot="title"><svg class="mascot" viewBox="0 0 120 120" aria-hidden="true"><use href="#nl-twinkles"></use><g class="bob"><use href="#nl-shape"></use><use href="#face-happy"></use></g></svg></div>
      <div class="eyebrow" id="t-eyebrow"></div>
      <h1 id="t-title"></h1>
      <div class="actions"><button class="btn btn-primary" id="start"></button></div>
    </section>

    <!-- 1. MOOD -->
    <section class="screen" id="s-1" hidden>
      <div class="mascot-stage" data-mascot="q1"><span class="prop" data-prop></span><svg class="mascot" viewBox="0 0 120 120" aria-hidden="true"><use href="#nl-twinkles"></use><g class="bob"><use href="#nl-shape"></use><use href="#face-sleepy"></use></g></svg></div>
      <h2 data-heading></h2>
      <p class="sub" data-sub></p>
      <div class="options" id="opts-1"></div>
      <div class="actions">
        <button class="btn btn-ghost nav-back">&larr; Back</button>
        <button class="btn btn-primary nav-next" disabled>Next &rarr;</button>
      </div>
      <div class="hint" id="hint-1"></div>
    </section>

    <!-- 2. TRANSPORT -->
    <section class="screen" id="s-2" hidden>
      <div class="mascot-stage" data-mascot="q2"><span class="prop" data-prop></span><svg class="mascot" viewBox="0 0 120 120" aria-hidden="true"><use href="#nl-twinkles"></use><g class="bob"><use href="#nl-shape"></use><use href="#face-excited"></use></g></svg></div>
      <h2 data-heading></h2>
      <p class="sub" data-sub></p>
      <div class="shortcuts">
        <button class="chip" id="sc-car" aria-pressed="false"></button>
        <button class="chip" id="sc-bus" aria-pressed="false"></button>
      </div>
      <div class="leg-label" id="leg-to-label"></div>
      <div class="opt-row" id="opts-to"></div>
      <div class="leg-label" id="leg-back-label"></div>
      <div class="opt-row" id="opts-back"></div>
      <div class="actions">
        <button class="btn btn-ghost nav-back">&larr; Back</button>
        <button class="btn btn-primary nav-next" disabled>Next &rarr;</button>
      </div>
      <div class="hint" id="hint-2"></div>
    </section>

    <!-- 3. WHERE -->
    <section class="screen" id="s-3" hidden>
      <div class="mascot-stage" data-mascot="q3"><span class="prop" data-prop></span><svg class="mascot" viewBox="0 0 120 120" aria-hidden="true"><use href="#nl-twinkles"></use><g class="bob"><use href="#nl-shape"></use><use href="#face-hungry"></use></g></svg></div>
      <h2 data-heading></h2>
      <p class="sub" data-sub></p>
      <div class="options" id="opts-3"></div>
      <div class="actions">
        <button class="btn btn-ghost nav-back">&larr; Back</button>
        <button class="btn btn-primary nav-next" disabled>Next &rarr;</button>
      </div>
      <div class="hint" id="hint-3"></div>
    </section>

    <!-- 4. WHAT -->
    <section class="screen" id="s-4" hidden>
      <div class="mascot-stage" data-mascot="q4"><span class="prop" data-prop></span><svg class="mascot" viewBox="0 0 120 120" aria-hidden="true"><use href="#nl-twinkles"></use><g class="bob"><use href="#nl-shape"></use><use href="#face-starry"></use></g></svg></div>
      <h2 data-heading></h2>
      <p class="sub" data-sub></p>
      <div class="options" id="opts-4"></div>
      <div class="actions">
        <button class="btn btn-ghost nav-back">&larr; Back</button>
        <button class="btn btn-primary nav-next" id="btn-consolidate" disabled></button>
      </div>
      <div class="hint" id="hint-4"></div>
    </section>

    <!-- 5. LOADING -->
    <section class="screen" id="s-load" hidden>
      <div class="loader">
        <div class="mascot-stage" data-mascot="loading"><svg class="mascot" viewBox="0 0 120 120" aria-hidden="true"><g class="hop"><use href="#nl-shape"></use><use href="#face-excited"></use></g></svg></div>
        <div class="load-msg" id="load-msg"></div>
        <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </section>

    <!-- 6. SUMMARY -->
    <section class="screen" id="s-done" hidden>
      <div class="mascot-stage" data-mascot="summary"><span class="prop" data-prop></span><svg class="mascot" viewBox="0 0 120 120" aria-hidden="true"><use href="#nl-twinkles"></use><g class="bob"><use href="#nl-shape"></use><use href="#face-grateful"></use></g></svg></div>
      <div class="eyebrow" id="sum-eyebrow"></div>
      <div class="receipt">
        <div class="thanks" id="sum-thanks"></div>
        <ul class="lines">
          <li><b id="lab1"></b><span id="o1"></span></li>
          <li><b id="lab2"></b><span id="o2"></span></li>
          <li><b id="lab3"></b><span id="o3"></span></li>
          <li><b id="lab4"></b><span id="o4"></span></li>
        </ul>
      </div>
      <div class="grand" id="grand"></div>
      <div class="sendoff" id="sum-sendoff"></div>
      <div class="actions">
        <button class="btn btn-ghost" id="restart">&#8635; Start over</button>
        <button class="btn btn-primary" id="copy">Copy as text</button>
      </div>
      <div class="ok" id="copied"></div>
    </section>

  </div>
</div>

<!-- reusable mascot -->

      <g class="twinkle" fill="#FFC9AE"><path d="M106 94 l2.2 5.4 5.4 2.2 -5.4 2.2 -2.2 5.4 -2.2-5.4 -5.4-2.2 5.4-2.2z"></path></g>
      <g class="twinkle" fill="#9FDCC2"><path d="M12 88 l1.9 4.6 4.6 1.9 -4.6 1.9 -1.9 4.6 -1.9-4.6 -4.6-1.9 4.6-1.9z"></path></g>

<script>
/* ==========================================================================
   ✏️  EDIT EVERYTHING HERE
   --------------------------------------------------------------------------
   Every word on every screen lives in this one COPY object. Change the text
   between the quote marks and save — nothing else needs touching.

   Rules of thumb:
     • Keep the quote marks "like this" and the commas at the end of lines.
     • Emoji can be pasted straight in.
     • Don't change the  v: "chill"  style codes — the logic matches on those.
     • {x} in the phrases means "whatever Jac typed in the blank".
       {X} means the same thing SHOUTED IN CAPITALS.

   (The browser-tab name is the <title> at the very top of this file.)
   ========================================================================== */
var COPY = {

  /* ---- YOUR OWN PICTURES (optional) ------------------------------------
     Leave these empty ("") and each screen shows the hand-drawn mascot,
     with a different expression per screen.

     To use your own picture instead, put the file next to this one — e.g.
     in an "images" folder — and write its name in here:

         q1: "images/sleepy.png",

     A full web address works too. Square PNGs with a transparent
     background look best. Anything you leave as "" keeps the drawing.
     --------------------------------------------------------------------- */
  images: {
    title:   "",
    q1:      "",
    q2:      "",
    q3:      "",
    q4:      "",
    loading: "",
    summary: ""
  },

  /* ---- screen 0: the title card ---- */
  eyebrow: "A very important decision",
  title: "Dinner date / breakfast blessings with John",
  startButton: "Let's goooo →",

  /* ---- screen 1: how is Jac feeling ---- */
  q1: {
    prop: "☀️",
    heading: "RISE AND SHINEEE the SUN IS RISEN indeed (in new york)",
    sub: "",
    hint: "Pick how Jac is feeling 👆",
    options: [
      { v: "chill", icon: "🌿", label: "Jac wants to chill — wake up and go straight out of the house ✨natural✨", note: "Chill and casual" },
      { v: "grand", icon: "🎉", label: "Jac wants to prepare for A GRAND CELEBRATION WITH abundant thanksgiving", note: "Grand CELEBRATION" }
    ]
  },

  /* ---- screen 2: how to get there ---- */
  q2: {
    prop: "🚗",
    heading: "Let's go on an ADVENTURE wheeee",
    sub: "",
    hint: "Pick a ride for BOTH directions 👆",
    shortcutBothCar: "🚗 A safe and smooth ride both ways :)",
    shortcutBothBus: "🚌 Public transport to dinner and back home",
    legToLabel: "🍽️ To the food",
    legToTag: "leg 1",
    legBackLabel: "🏡 Back home",
    legBackTag: "leg 2",
    toOptions: [
      { v: "car", icon: "🚗", label: "A safe and smooth ride from John", note: "To dinner only" },
      { v: "bus", icon: "🚌", label: "Jac's beloved public transport", note: "To dinner" }
    ],
    backOptions: [
      { v: "car", icon: "🚗", label: "A safe and smooth ride from John", note: "Back home only" },
      { v: "bus", icon: "🚌", label: "Jac's beloved public transport", note: "Back home only" }
    ]
  },

  /* ---- screen 3: roughly where ---- */
  q3: {
    prop: "🗺️",
    heading: "WHERE IS MY FOOOOD???",
    sub: "",
    hint: "Pick roughly where 👆",
    options: [
      { v: "near",  icon: "🏡", label: "Somewhere near Jac", note: "Minimal travelling, maximum eating" },
      { v: "far",   icon: "🚏", label: "Somewhere with good food but not so near Jac", note: "Worth the little journey" },
      { v: "steak", icon: "🥩", label: "CELEBRATE WITH STEAKKKK where John booked (Telok Ayer)", note: "Already reserved, just say yes" }
    ]
  },

  /* ---- screen 4: what to eat ---- */
  q4: {
    prop: "🍽️",
    heading: "WHAT SHALL BECOME THE WORTHY SACRIFICE FOR meeee???",
    sub: "",
    hint: "Pick what to eat, and fill in the blank if you chose one 👆",
    button: "Consolidate! ✨",
    options: [
      { v: "breakfast", icon: "🍳", label: "GOOD MORNING rise and shine lets eat some BREAKFAST" },
      { v: "light",     icon: "🥗", label: "Something light" },
      { v: "heavy",     icon: "🍛", label: "Something heavy" },
      { v: "kinda",     icon: "🤔", label: "I kinda want...",   note: "Fill in the blank", blank: "I kinda want... (e.g. laksa)" },
      { v: "craving",   icon: "😤", label: "I'M CRAVING ____",  note: "Fill in the blank", blank: "I'M CRAVING... (e.g. KOREAN BBQ)" },
      { v: "steak",     icon: "🥩", label: "STEAKKKK" }
    ]
  },

  /* ---- the loading screen ---- */
  loading: {
    seconds: 2.9,
    messages: [
      "Consolidating your cravings…",
      "Warming up the appetite 🍳",
      "Checking the weather in New York ☀️",
      "Counting the blessings 🙏"
    ]
  },

  /* ---- the final summary screen ---- */
  summary: {
    prop: "🙏",
    eyebrow: "The plan, confirmed",
    thanks: "Thank you for your precious time and thank God for clarity 🙏🙏",
    label1: "Jac feels like...",
    label2: "She wants to...",
    label3: "Feasting...",
    label4: "On...",
    sendoff: "Screenshot and send John please thanks hehe 📸"
  },

  /* ---- the four summary lines, one phrase per answer ---- */
  lines: {
    mood: {
      chill: "chill and casual — wake up and go straight out of the house ✨natural✨",
      grand: "A GRAND CELEBRATION with abundant thanksgiving 🎉"
    },
    transport: {
      "car-car": "have a safe and smooth ride from John, both ways 🚗✨",
      "car-bus": "take a safe and smooth ride from John to the food, then her beloved public transport back home 🚗 → 🚌",
      "bus-car": "take her beloved public transport to the food, then a safe and smooth ride home from John 🚌 → 🚗",
      "bus-bus": "take her beloved public transport to the food and back home 🚌🚌"
    },
    where: {
      near:  "somewhere near Jac 🏡",
      far:   "somewhere with good food, a little further from Jac 🚏",
      steak: "at the steak place John booked in Telok Ayer 🥩"
    },
    food: {
      breakfast: "a GOOD MORNING rise-and-shine BREAKFAST 🍳",
      light:     "something light 🥗",
      heavy:     "something heavy 🍛",
      kinda:     "{x} — she kinda wants it 🤔",
      craving:   "{X} — she is CRAVING it 😤",
      steak:     "STEAKKKK 🥩🥩🥩"
    }
  },

  /* ---- the one big exciting sentence, stitched together from these ---- */
  sentence: {
    opening: {
      chill: "Jac is keeping it chill and ✨natural✨ today, so she will ",
      grand: "Jac is going FULL GRAND CELEBRATION today, so she will "
    },
    transport: {
      "car-car": "ride with John both ways",
      "car-bus": "ride there with John and take public transport home",
      "bus-car": "take public transport there and ride home with John",
      "bus-bus": "take public transport there and back"
    },
    joiner: ", feasting on ",
    food: {
      breakfast: "a proper rise-and-shine breakfast",
      light:     "something light",
      heavy:     "something gloriously heavy",
      kinda:     "{x}",
      craving:   "{X}",
      steak:     "STEAKKKK"
    },
    where: {
      near:  "somewhere near her",
      far:   "somewhere a little further out with really good food",
      steak: "at the Telok Ayer steak place John already booked"
    },
    closing: {
      chill: " No fuss, just good food and good company — see you very soon!! 🤍",
      grand: " Dressed up, thankful, and ready to feast — see you very soon!! 🎉"
    }
  },

  /* ---- little bits of interface wording ---- */
  ui: {
    progressStart: "Let's begin",
    progressStep: "Step {n} of 4",
    progressDone: "All done!",
    copied: "Copied! Paste it to John 💛",
    copySelected: "Selected — long-press to copy, or just screenshot 📸",
    copyFailed: "Couldn't copy — a screenshot works just as well 📸"
  }
};

/* ==========================================================================
   Below here is the machinery. You shouldn't need to change it.
   ========================================================================== */
(function(){
  "use strict";

  var S = { mood:null, to:null, back:null, where:null, food:null, kinda:"", craving:"" };
  var order = ["s-title","s-1","s-2","s-3","s-4","s-load","s-done"];
  var idx = 0;

  function byId(id){ return document.getElementById(id); }
  function fill(x, text){ if(x) x.textContent = text || ""; }

  /* ---------- build the option buttons from COPY ---------- */
  function renderOptions(container, list){
    container.innerHTML = "";
    list.forEach(function(o){
      var b = document.createElement("button");
      b.className = "opt";
      b.type = "button";
      b.setAttribute("data-v", o.v);
      b.setAttribute("aria-pressed", "false");

      var ico = document.createElement("span");
      ico.className = "ico";
      ico.textContent = o.icon || "";
      b.appendChild(ico);

      var txt = document.createElement("span");
      txt.className = "txt";
      txt.appendChild(document.createTextNode(o.label));
      if(o.note){
        var s = document.createElement("small");
        s.textContent = o.note;
        txt.appendChild(s);
      }
      b.appendChild(txt);
      container.appendChild(b);

      if(o.blank){
        var wrap = document.createElement("div");
        wrap.className = "blank";
        wrap.id = "blank-" + o.v;
        var inp = document.createElement("input");
        inp.type = "text";
        inp.id = "in-" + o.v;
        inp.maxLength = 60;
        inp.placeholder = o.blank;
        inp.autocomplete = "off";
        inp.addEventListener("input", function(){ S[o.v] = this.value; refresh(); });
        wrap.appendChild(inp);
        container.appendChild(wrap);
      }
    });
  }

  /* swap the drawn mascot for a picture file, where one is configured */
  function applyImages(){
    var set = COPY.images || {};
    Array.prototype.forEach.call(document.querySelectorAll("[data-mascot]"), function(stage){
      var src = set[stage.getAttribute("data-mascot")];
      if(!src) return;
      var svg = stage.querySelector("svg.mascot");
      if(!svg) return;
      var img = document.createElement("img");
      img.className = "mascot-img";
      img.src = src;
      img.alt = "";
      svg.replaceWith(img);
    });
  }

  function paint(){
    applyImages();
    fill(byId("t-eyebrow"), COPY.eyebrow);
    fill(byId("t-title"), COPY.title);
    fill(byId("start"), COPY.startButton);

    [["s-1", COPY.q1], ["s-2", COPY.q2], ["s-3", COPY.q3], ["s-4", COPY.q4]].forEach(function(pair){
      var sc = byId(pair[0]), c = pair[1];
      fill(sc.querySelector("[data-prop]"), c.prop);
      fill(sc.querySelector("[data-heading]"), c.heading);
      fill(sc.querySelector("[data-sub]"), c.sub);
    });

    renderOptions(byId("opts-1"), COPY.q1.options);

    fill(byId("sc-car"), COPY.q2.shortcutBothCar);
    fill(byId("sc-bus"), COPY.q2.shortcutBothBus);
    byId("leg-to-label").innerHTML = "";
    byId("leg-to-label").appendChild(document.createTextNode(COPY.q2.legToLabel + " "));
    var t1 = document.createElement("span"); t1.textContent = COPY.q2.legToTag;
    byId("leg-to-label").appendChild(t1);
    byId("leg-back-label").innerHTML = "";
    byId("leg-back-label").appendChild(document.createTextNode(COPY.q2.legBackLabel + " "));
    var t2 = document.createElement("span"); t2.textContent = COPY.q2.legBackTag;
    byId("leg-back-label").appendChild(t2);
    renderOptions(byId("opts-to"), COPY.q2.toOptions);
    renderOptions(byId("opts-back"), COPY.q2.backOptions);

    renderOptions(byId("opts-3"), COPY.q3.options);
    renderOptions(byId("opts-4"), COPY.q4.options);
    fill(byId("btn-consolidate"), COPY.q4.button);

    fill(byId("sum-eyebrow"), COPY.summary.eyebrow);
    fill(byId("s-done").querySelector("[data-prop]"), COPY.summary.prop);
    fill(byId("sum-thanks"), COPY.summary.thanks);
    fill(byId("lab1"), COPY.summary.label1);
    fill(byId("lab2"), COPY.summary.label2);
    fill(byId("lab3"), COPY.summary.label3);
    fill(byId("lab4"), COPY.summary.label4);
    fill(byId("sum-sendoff"), COPY.summary.sendoff);
  }

  /* ---------- screen plumbing ---------- */
  function show(i){
    idx = i;
    order.forEach(function(id, n){ byId(id).hidden = (n !== i); });
    var qStep = [0,1,2,3,4,4,4][i];
    byId("pfill").style.width = (qStep / 4 * 100) + "%";
    byId("plabel").textContent = i === 0
      ? COPY.ui.progressStart
      : (i >= 5 ? COPY.ui.progressDone : COPY.ui.progressStep.replace("{n}", qStep));
    try { window.scrollTo({ top:0, behavior:"smooth" }); } catch(e) { window.scrollTo(0,0); }
  }

  function pick(container, value){
    Array.prototype.forEach.call(container.querySelectorAll(".opt"), function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-v") === value ? "true" : "false");
    });
  }

  function wireSingle(containerId, key, after){
    var c = byId(containerId);
    c.addEventListener("click", function(e){
      var b = e.target.closest(".opt");
      if(!b || !c.contains(b)) return;
      var v = b.getAttribute("data-v");
      S[key] = v;
      pick(c, v);
      if(after) after(v);
      refresh();
    });
  }

  function blanks(){
    COPY.q4.options.forEach(function(o){
      if(!o.blank) return;
      var el = byId("blank-" + o.v);
      if(el) el.classList.toggle("show", S.food === o.v);
    });
  }

  function syncChips(){
    byId("sc-car").setAttribute("aria-pressed", (S.to === "car" && S.back === "car") ? "true" : "false");
    byId("sc-bus").setAttribute("aria-pressed", (S.to === "bus" && S.back === "bus") ? "true" : "false");
  }

  function setBoth(v){
    S.to = v; S.back = v;
    pick(byId("opts-to"), v);
    pick(byId("opts-back"), v);
    syncChips(); refresh();
  }

  /* ---------- validation ---------- */
  function needsBlank(v){
    var o = COPY.q4.options.filter(function(x){ return x.v === v; })[0];
    return !!(o && o.blank);
  }
  function valid(i){
    if(i === 1) return !!S.mood;
    if(i === 2) return !!S.to && !!S.back;
    if(i === 3) return !!S.where;
    if(i === 4){
      if(!S.food) return false;
      if(needsBlank(S.food)) return String(S[S.food] || "").trim().length > 0;
      return true;
    }
    return true;
  }
  var hints = { 1: COPY.q1.hint, 2: COPY.q2.hint, 3: COPY.q3.hint, 4: COPY.q4.hint };
  function refresh(){
    for(var i = 1; i <= 4; i++){
      var sc = byId("s-" + i);
      if(!sc) continue;
      var ok = valid(i);
      sc.querySelector(".nav-next").disabled = !ok;
      byId("hint-" + i).textContent = ok ? "" : hints[i];
    }
  }

  /* ---------- loader ---------- */
  function runLoader(){
    show(5);
    var msgs = COPY.loading.messages, el = byId("load-msg"), n = 0;
    el.textContent = msgs[0] || "";
    var total = (COPY.loading.seconds || 2.9) * 1000;
    var every = msgs.length > 1 ? total / msgs.length : total;
    var t = setInterval(function(){
      n++;
      if(n < msgs.length) el.textContent = msgs[n];
    }, every);
    setTimeout(function(){
      clearInterval(t);
      buildSummary();
      show(6);
    }, total);
  }

  /* ---------- the words ---------- */
  function typed(){ return String(S[S.food] || "").trim(); }
  function sub(tpl){
    return String(tpl || "")
      .replace("{x}", typed())
      .replace("{X}", typed().toUpperCase());
  }
  function leg(){ return S.to + "-" + S.back; }

  function L1(){ return COPY.lines.mood[S.mood] || ""; }
  function L2(){ return COPY.lines.transport[leg()] || ""; }
  function L3(){ return COPY.lines.where[S.where] || ""; }
  function L4(){ return sub(COPY.lines.food[S.food]); }

  function grandSentence(){
    var s = COPY.sentence;
    return (s.opening[S.mood] || "")
      + (s.transport[leg()] || "")
      + s.joiner
      + sub(s.food[S.food])
      + " " + (s.where[S.where] || "")
      + "." + (s.closing[S.mood] || "");
  }

  function buildSummary(){
    fill(byId("o1"), L1());
    fill(byId("o2"), L2());
    fill(byId("o3"), L3());
    fill(byId("o4"), L4());
    fill(byId("grand"), grandSentence());
  }

  function plainText(){
    var m = COPY.summary;
    return m.thanks + "\n\n"
      + m.label1 + " " + L1() + "\n"
      + m.label2 + " " + L2() + "\n"
      + m.label3 + " " + L3() + "\n"
      + m.label4 + " " + L4() + "\n\n"
      + grandSentence() + "\n\n"
      + m.sendoff;
  }

  /* ---------- wiring ---------- */
  paint();

  wireSingle("opts-1", "mood");
  wireSingle("opts-to", "to", syncChips);
  wireSingle("opts-back", "back", syncChips);
  byId("sc-car").addEventListener("click", function(){ setBoth("car"); });
  byId("sc-bus").addEventListener("click", function(){ setBoth("bus"); });

  wireSingle("opts-3", "where", function(v){
    if(v === "steak"){
      S.food = "steak";
      pick(byId("opts-4"), "steak");
      blanks();
    }
  });

  wireSingle("opts-4", "food", function(v){
    blanks();
    var inp = byId("in-" + v);
    if(inp) inp.focus();
  });

  byId("start").addEventListener("click", function(){ show(1); });
  Array.prototype.forEach.call(document.querySelectorAll(".nav-back"), function(b){
    b.addEventListener("click", function(){ show(idx - 1); });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".nav-next"), function(b){
    b.addEventListener("click", function(){
      if(!valid(idx)) return;
      if(idx === 4){ runLoader(); } else { show(idx + 1); }
    });
  });

  function selectFallback(msg){
    try{
      var r = document.createRange();
      r.selectNodeContents(byId("s-done").querySelector(".receipt"));
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
      msg.textContent = COPY.ui.copySelected;
    }catch(e){
      msg.textContent = COPY.ui.copyFailed;
    }
  }
  byId("copy").addEventListener("click", function(){
    var msg = byId("copied");
    try{
      navigator.clipboard.writeText(plainText()).then(function(){
        msg.textContent = COPY.ui.copied;
      }, function(){ selectFallback(msg); });
    }catch(e){ selectFallback(msg); }
  });

  byId("restart").addEventListener("click", function(){
    S = { mood:null, to:null, back:null, where:null, food:null, kinda:"", craving:"" };
    ["opts-1","opts-to","opts-back","opts-3","opts-4"].forEach(function(id){ pick(byId(id), null); });
    syncChips();
    blanks();
    COPY.q4.options.forEach(function(o){
      if(!o.blank) return;
      var inp = byId("in-" + o.v);
      if(inp) inp.value = "";
    });
    byId("copied").textContent = "";
    refresh();
    show(0);
  });

  refresh();
  show(0);
})();
</script>
