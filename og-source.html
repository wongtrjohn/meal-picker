  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:
      radial-gradient(760px 520px at 8% -10%, #FFE4A3 0%, transparent 62%),

  .art svg{width:300px;height:300px;display:block;overflow:visible}
  .words{min-width:0;display:flex;flex-direction:column;gap:16px}
  .eyebrow{font-size:21px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#F5BE3F}
  h1{font-family:"Baloo 2",system-ui,sans-serif;font-size:66px;line-height:1.04;font-weight:800;text-wrap:balance}
  p{font-size:27px;font-weight:700;color:#9A8167;line-height:1.35}
  .pill{
    align-self:flex-start;margin-top:8px;background:linear-gradient(170deg,#F5BE3F,#E8A51F);
    color:#4B3621;font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:26px;
